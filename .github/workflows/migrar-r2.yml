# Cópia completa do site publicado (branch gh-pages) para o Cloudflare R2 (bucket tanaurna-site).
# Usado na migração para a Cloudflare e, se preciso, para ressincronizar tudo. Só envia o que
# não existe no R2 ou mudou (MD5). Autenticação: token OIDC do GitHub (sem senha guardada).
name: Site → R2 (cópia completa)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  copiar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: backend

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências
        run: pip install -q "requests>=2.32"

      - name: Site publicado (gh-pages, só a versão atual)
        run: git clone -q --depth 1 --branch gh-pages "https://github.com/${{ github.repository }}.git" site

      - name: Enviar ao R2
        working-directory: backend
        run: python -m etl.r2 enviar ../site
