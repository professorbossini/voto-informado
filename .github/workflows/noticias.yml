# Notícias → site, todo dia, sem depender de nenhum computador e sem data para acabar.
#
# Para cada parlamentar em exercício e cada partido, busca as 5 notícias mais recentes (últimos
# 30 dias) no Google Notícias e grava api/noticias/... no site publicado (gh-pages), só quando
# muda. Lógica em backend/etl/noticias.py. Não são dados oficiais: o site exibe com aviso e fonte.
name: Notícias → site

on:
  schedule:
    - cron: "17 9 * * *" # 06h17 em Brasília
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # gravação no R2 da Cloudflare (etl.r2, OIDC)
  pages: write
  actions: write

concurrency:
  # Uma fila por automação: com uma fila só para todas, o GitHub cancela a que estava esperando.
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  noticias:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: backend

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências
        run: pip install -q "requests>=2.32"

      - name: Site publicado (plenário e notícias)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone -q --depth 1 --filter=blob:none --no-checkout --branch gh-pages \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" site
          git -C site sparse-checkout set --no-cone /api/plenario.json /api/stf.json /api/noticias/
          git -C site checkout -q gh-pages

      - name: Buscar notícias
        id: noticias
        working-directory: backend
        run: python -m etl.noticias ../site

      - name: Publicar
        if: steps.noticias.outputs.mudou == '1'
        working-directory: site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A api/noticias
          if git diff --cached --quiet; then echo "Nada mudou."; exit 0; fi
          git commit -q -m "Notícias: atualização diária"
          # Outro workflow pode ter publicado enquanto este buscava: rebase antes de enviar.
          # Outra automação pode ter publicado nesse meio-tempo: incorpora e tenta de novo.
          for i in 1 2 3 4 5; do git pull -q --rebase origin gh-pages && git push -q origin gh-pages && break; git rebase --abort 2>/dev/null; sleep $((i * 7)); done
          gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null || true
          echo "✓ notícias publicadas" >> "$GITHUB_STEP_SUMMARY"

      - name: Enviar ao R2 (Cloudflare)
        if: steps.noticias.outputs.mudou == '1'
        working-directory: backend
        run: python -m etl.r2 enviar ../site

      # O GitHub desliga agendamentos de repositórios sem atividade por 60 dias.
      - name: Manter o agendamento ligado
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/noticias.yml/enable" >/dev/null || true
