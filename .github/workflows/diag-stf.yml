# Diagnóstico temporário: quais endereços do STF respondem a partir do GitHub Actions.
name: Diagnóstico STF
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36"
          for u in \
            "https://portal.stf.jus.br/ostf/plenario/composicao.asp" \
            "https://portal.stf.jus.br/" \
            "https://portal.stf.jus.br/textos/verTexto.asp?servico=bibliotecaConsultaProdutoBibliotecaPastaMinistro&pagina=EdsonFachinPrincipal" \
            "https://portal.stf.jus.br/util/imagem.asp?tamanho=normal&id=2901" \
            "http://www.stf.jus.br/arquivo/biblioteca/PastasMinistros/EdsonFachin/DadosDatas/001.pdf" \
            "https://www.stf.jus.br/" \
            "https://egesp-portal.stf.jus.br/transparencia/rendimento_folha" \
            "https://egesp-portal.stf.jus.br/transparencia/tipos_folhas_referencia?ano=2026&mes=8" \
            "https://transparencia.stf.jus.br/single/?appid=36ff6da1-92c2-41ab-8995-fd7153419ab2&opt=currsel" \
            "https://noticias.stf.jus.br/" \
            "https://portal.stf.jus.br/processos/" \
            "https://jurisprudencia.stf.jus.br/" ; do
            curl -s -o /dev/null -m 30 -A "$UA" -H "Accept: text/html,*/*" -H "Accept-Language: pt-BR,pt;q=0.9" -w "%{http_code} %{size_download} $u\n" "$u" || echo "falhou $u"
          done
          curl -s -m 20 https://api.ipify.org; echo
