# Apuração → site, sem depender de nenhum computador.
#
# A cada 10 min consulta o TSE. Quando aparece totalização FINAL nova, reescreve só os JSON
# que dependem do resultado (perfis, resultados, 2º turno, meta) no site publicado (gh-pages)
# e envia a diferença. O parcial não passa por aqui: o site o mostra ao vivo, direto do TSE.
# Lógica em backend/etl/apuracao_remota.py; desliga sozinho depois de 01/11/2026.
name: Apuração → site

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  apuracao:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Período de divulgação
        id: periodo
        run: |
          if [[ "$(TZ=America/Sao_Paulo date +%F)" > "2026-11-01" ]]; then
            echo "Período de divulgação encerrado: nada a fazer."
            echo "ativo=0" >> "$GITHUB_OUTPUT"
          else
            echo "ativo=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.periodo.outputs.ativo == '1'
        with:
          sparse-checkout: backend

      - uses: actions/setup-python@v5
        if: steps.periodo.outputs.ativo == '1'
        with:
          python-version: "3.12"

      - name: Dependências
        if: steps.periodo.outputs.ativo == '1'
        run: pip install -q "requests>=2.32"

      - name: Site publicado (só o marcador do último resultado aplicado)
        if: steps.periodo.outputs.ativo == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone -q --depth 1 --filter=blob:none --no-checkout --branch gh-pages \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" site
          git -C site sparse-checkout set --no-cone /api/apuracao-final.json
          git -C site checkout -q gh-pages

      - name: Consultar o TSE
        id: tse
        if: steps.periodo.outputs.ativo == '1'
        working-directory: backend
        run: python -m etl.apuracao_remota verificar ../site --salvar ../finais.json

      - name: Baixar os dados do site (api/)
        if: steps.tse.outputs.mudou == '1'
        run: git -C site sparse-checkout set --no-cone /api/

      - name: Aplicar o resultado final
        if: steps.tse.outputs.mudou == '1'
        working-directory: backend
        run: python -m etl.apuracao_remota aplicar ../site --de ../finais.json

      - name: Publicar
        if: steps.tse.outputs.mudou == '1'
        working-directory: site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A api
          if git diff --cached --quiet; then echo "Nada mudou."; exit 0; fi
          git commit -q -m "Apuração: resultado final do TSE (${{ steps.tse.outputs.disputas }} disputas)"
          git push -q origin gh-pages
          # Garante a nova versão do GitHub Pages (push feito com GITHUB_TOKEN).
          gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null || true
          echo "✓ publicado" >> "$GITHUB_STEP_SUMMARY"
