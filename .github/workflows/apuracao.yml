# Apuração → site, sem depender de nenhum computador, em toda eleição geral.
#
# Só roda no período em que pode haver eleição (os dois turnos são sempre em outubro: CF, art. 77)
# e, dentro dele, só segue se a configuração oficial do TSE (ele-c.json) mostrar uma eleição geral
# em divulgação: daí vêm o ciclo (ele2026, ele2030…) e os códigos dos dois turnos (etl.calendario_tse).
# Quando aparece totalização FINAL nova, reescreve só os JSON que dependem do resultado (perfis,
# resultados, 2º turno, meta) no site publicado (gh-pages). O parcial não passa por aqui: o site o
# mostra ao vivo, direto do TSE. Lógica em backend/etl/apuracao_remota.py.
name: Apuração → site

on:
  schedule:
    # A cada 30 min (UTC) só em 1–12/out (1º turno: 1º domingo de outubro), 24–31/out e 1–6/nov
    # (2º turno: último domingo de outubro). Fora disso, nenhuma execução (e nenhum minuto gasto).
    - cron: "7,37 * 1-12,24-31 10 *"
    - cron: "7,37 * 1-6 11 *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  apuracao:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: backend

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências
        run: pip install -q "requests>=2.32"

      - name: Eleição em divulgação (configuração oficial do TSE)
        id: periodo
        working-directory: backend
        run: python -m etl.calendario_tse

      - name: Site publicado (só o marcador do último resultado aplicado)
        if: steps.periodo.outputs.ativo == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone -q --depth 1 --filter=blob:none --no-checkout --branch gh-pages \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" site
          git -C site sparse-checkout set --no-cone /api/apuracao-final.json
          git -C site checkout -q gh-pages

      - name: Consultar o TSE
        id: tse
        if: steps.periodo.outputs.ativo == '1'
        working-directory: backend
        run: python -m etl.apuracao_remota verificar ../site --salvar ../finais.json

      - name: Baixar os dados do site (api/)
        if: steps.tse.outputs.mudou == '1'
        run: git -C site sparse-checkout set --no-cone /api/

      - name: Aplicar o resultado final
        if: steps.tse.outputs.mudou == '1'
        working-directory: backend
        run: python -m etl.apuracao_remota aplicar ../site --de ../finais.json

      - name: Publicar
        if: steps.tse.outputs.mudou == '1'
        working-directory: site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A api
          if git diff --cached --quiet; then echo "Nada mudou."; exit 0; fi
          git commit -q -m "Apuração: resultado final do TSE (${{ steps.tse.outputs.disputas }} disputas)"
          git push -q origin gh-pages
          # Garante a nova versão do GitHub Pages (push feito com GITHUB_TOKEN).
          gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null || true
          echo "✓ publicado" >> "$GITHUB_STEP_SUMMARY"
