# Prestação de contas (TSE) → site, sozinho na nuvem (GitHub Actions), sem depender de nenhum computador.
#
# Receitas e despesas declaradas por cada campanha de 2026, do arquivo oficial do TSE
# (prestacao_de_contas_eleitorais_candidatos_2026.zip, Portal de Dados Abertos). As campanhas seguem
# enviando dados até a prestação de contas final, e o TSE republica o arquivo: toda segunda-feira
# (06h41 de Brasília) este workflow confere o arquivo e, se mudou (ETag/Last-Modified), recalcula as
# finanças com a mesma conta do build local e reescreve só os JSON que dependem delas, inclusive o
# custo por voto de quem foi eleito. Lógica em backend/etl/contas.py.
#
# Agendado só até o fim de 2026 (depois disso a passada semanal para sem consultar nada); o disparo
# manual (workflow_dispatch) continua valendo, com a opção de reaplicar mesmo sem mudança no TSE.
name: Prestação de contas → site

on:
  schedule:
    - cron: "41 9 * * 1" # segunda-feira, 06h41 de Brasília
  push:
    branches: [main]
    paths:
      - "backend/etl/contas.py"
      - ".github/workflows/contas.yml"
  workflow_dispatch:
    inputs:
      forcar:
        description: "Reaplicar mesmo sem mudança no arquivo do TSE"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  actions: write
  id-token: write # gravação no R2 da Cloudflare (etl.r2, OIDC)

concurrency:
  group: gh-pages
  cancel-in-progress: false

env:
  ATE: "2026-12-31" # último dia da passada agendada

jobs:
  contas:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Ainda no período?
        id: periodo
        run: |
          if [[ "${{ github.event_name }}" == "schedule" && "$(date -u +%F)" > "$ATE" ]]; then
            echo "Fim do período agendado ($ATE): nada a fazer."; echo "seguir=0" >> "$GITHUB_OUTPUT"
          else
            echo "seguir=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.periodo.outputs.seguir == '1'
        with:
          sparse-checkout: backend

      - uses: actions/setup-python@v5
        if: steps.periodo.outputs.seguir == '1'
        with:
          python-version: "3.12"

      - name: Dependências
        if: steps.periodo.outputs.seguir == '1'
        run: pip install -q "requests>=2.32" "pandas>=2.2"

      - name: Site publicado (só a marca do último arquivo aplicado)
        if: steps.periodo.outputs.seguir == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone -q --depth 1 --filter=blob:none --no-checkout --branch gh-pages \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" site
          git -C site sparse-checkout set --no-cone /api/contas-meta.json
          git -C site checkout -q gh-pages

      - name: O arquivo do TSE mudou?
        id: tse
        if: steps.periodo.outputs.seguir == '1'
        working-directory: backend
        run: |
          python -m etl.contas verificar ../site
          # Mudança no próprio código (push) ou pedido manual: reaplica mesmo com o mesmo arquivo.
          if [[ "${{ github.event_name }}" == "push" || "${{ inputs.forcar }}" == "true" ]]; then
            echo "forcar=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Baixar os dados do site que dependem das finanças
        id: dados
        if: steps.tse.outputs.mudou == '1' || steps.tse.outputs.forcar == '1'
        run: |
          # ~21 mil perfis em api/candidato/ mais as listas que repetem receitas e despesas.
          git -C site sparse-checkout set --no-cone /api/contas-meta.json /api/candidato/ /api/presidente.json \
            /api/uf/ /api/segundo-turno.json /api/estatisticas.json /api/busca.json /api/meta.json
          echo "perfis: $(ls site/api/candidato | wc -l)"
          echo "seguir=1" >> "$GITHUB_OUTPUT"

      - name: Recalcular e aplicar
        id: contas
        if: steps.dados.outputs.seguir == '1'
        working-directory: backend
        run: python -m etl.contas atualizar ../site ${{ steps.tse.outputs.forcar == '1' && '--forcar' || '' }}

      - name: Publicar
        id: publicar
        if: steps.dados.outputs.seguir == '1'
        working-directory: site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A api
          if git diff --cached --quiet; then echo "Nada mudou."; exit 0; fi
          git commit -q -m "Prestação de contas do TSE: finanças de campanha (${{ steps.contas.outputs.perfis }} perfis)"
          git push -q origin gh-pages
          gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null || true
          echo "enviar=1" >> "$GITHUB_OUTPUT"
          echo "✓ finanças publicadas (${{ steps.contas.outputs.perfis }} perfis alterados)" >> "$GITHUB_STEP_SUMMARY"

      - name: Enviar ao R2 (Cloudflare)
        if: steps.publicar.outputs.enviar == '1'
        working-directory: backend
        run: python -m etl.r2 enviar ../site --prefixo api/

      # O GitHub desliga agendamentos de repositórios sem atividade por 60 dias; reativar
      # este workflow a cada execução mantém a atualização ligada.
      - name: Manter o agendamento ligado
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/contas.yml/enable" >/dev/null || true
