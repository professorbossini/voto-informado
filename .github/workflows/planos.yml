# Busca nos planos de governo do 2º turno → site, sozinho na nuvem (GitHub Actions).
#
# Lê as disputas e os finalistas de api/segundo-turno.json, extrai o texto de cada página dos
# planos de governo registrados no TSE (os PDFs publicados pelo site em /propostas/) e grava
# api/planos/... no site publicado (gh-pages e R2 da Cloudflare), só quando muda.
# Lógica em backend/etl/planos.py. Os planos dos finalistas quase nunca mudam: uma passada por dia
# entre 8 e 24 de outubro (véspera do 2º turno) basta; fora disso, só manualmente.
# Os PDFs vêm do site publicado por HTTPS, sem baixar a pasta /propostas/ inteira da gh-pages.
name: Planos de governo → site

on:
  schedule:
    - cron: "23 9 8-24 10 *" # 06h23 em Brasília, de 8 a 24 de outubro
  push:
    branches: [main]
    paths:
      - "backend/etl/planos.py"
      - ".github/workflows/planos.yml"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # gravação no R2 da Cloudflare (etl.r2, OIDC)
  pages: write
  actions: write

concurrency:
  # Uma fila por automação: com uma fila só para todas, o GitHub cancela a que estava esperando.
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  planos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: backend

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências
        run: pip install -q "requests>=2.32" "pypdf>=5"

      - name: Site publicado (2º turno e planos)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone -q --depth 1 --filter=blob:none --no-checkout --branch gh-pages \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" site
          git -C site sparse-checkout set --no-cone /api/segundo-turno.json /api/planos/
          git -C site checkout -q gh-pages

      - name: Texto dos planos de governo (PDFs registrados no TSE)
        id: planos
        working-directory: backend
        run: python -m etl.planos ../site

      - name: Publicar
        if: steps.planos.outputs.mudou == '1'
        working-directory: site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A api/planos
          if git diff --cached --quiet; then echo "Nada mudou."; exit 0; fi
          git commit -q -m "Planos de governo do 2º turno: texto para a busca (TSE)"
          # Outra automação pode ter publicado nesse meio-tempo: incorpora e tenta de novo.
          for i in 1 2 3 4 5; do git pull -q --rebase origin gh-pages && git push -q origin gh-pages && break; git rebase --abort 2>/dev/null; sleep $((i * 7)); done
          gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null || true
          echo "✓ planos de governo publicados" >> "$GITHUB_STEP_SUMMARY"

      - name: Enviar ao R2 (Cloudflare)
        if: steps.planos.outputs.mudou == '1'
        working-directory: backend
        run: python -m etl.r2 enviar ../site --prefixo api/planos/

      # O GitHub desliga agendamentos de repositórios sem atividade por 60 dias.
      - name: Manter o agendamento ligado
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/planos.yml/enable" >/dev/null || true
