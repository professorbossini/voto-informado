# Votações nominais → site, todo dia, sem depender de nenhum computador.
#
# Como cada deputado federal e senador em exercício votou nas votações nominais do Plenário da
# legislatura atual, com presença e participação. Fontes oficiais: arquivos anuais de votações da
# Câmara (publicados de madrugada, por volta das 4h de Brasília), histórico de exercício de cada
# deputado e o serviço de votações do Senado. Lógica em backend/etl/votacoes.py.
#
# Incremental: anos encerrados ficam guardados no próprio site (api/votacoes/base/) e não são
# baixados de novo; só o ano corrente é consultado todo dia. Publica só o que mudou.
name: Votações → site

on:
  schedule:
    - cron: "37 7 * * *" # 04h37 em Brasília
  push:
    branches: [main]
    paths:
      - "backend/etl/votacoes.py"
      - ".github/workflows/votacoes.yml"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # gravação no R2 da Cloudflare (etl.r2, OIDC)
  pages: write
  actions: write

concurrency:
  # Uma fila por automação: com uma fila só para todas, o GitHub cancela a que estava esperando.
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  votacoes:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: backend

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências
        run: pip install -q "requests>=2.32"

      - name: Site publicado (plenário e votações)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone -q --depth 1 --filter=blob:none --no-checkout --branch gh-pages \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" site
          git -C site sparse-checkout set --no-cone /api/plenario.json /api/votacoes/
          git -C site checkout -q gh-pages

      - name: Consultar votações da Câmara e do Senado
        id: votacoes
        working-directory: backend
        run: python -m etl.votacoes ../site

      - name: Publicar
        if: steps.votacoes.outputs.mudou == '1'
        working-directory: site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A api/votacoes
          if git diff --cached --quiet; then echo "Nada mudou."; exit 0; fi
          git commit -q -m "Votações nominais: atualização diária"
          # Outro workflow pode ter publicado enquanto este consultava: rebase antes de enviar.
          # Outra automação pode ter publicado nesse meio-tempo: incorpora e tenta de novo.
          for i in 1 2 3 4 5; do git pull -q --rebase origin gh-pages && git push -q origin gh-pages && break; git rebase --abort 2>/dev/null; sleep $((i * 7)); done
          gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null || true
          echo "✓ votações publicadas" >> "$GITHUB_STEP_SUMMARY"

      - name: Enviar ao R2 (Cloudflare)
        if: steps.votacoes.outputs.mudou == '1'
        working-directory: backend
        run: python -m etl.r2 enviar ../site --prefixo api/votacoes/

      # O GitHub desliga agendamentos de repositórios sem atividade por 60 dias.
      - name: Manter o agendamento ligado
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/votacoes.yml/enable" >/dev/null || true
